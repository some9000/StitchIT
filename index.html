<!DOCTYPE html><html lang="en"><head>  <meta charset="UTF-8">  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">  <meta http-equiv="Pragma" content="no-cache">  <meta http-equiv="Expires" content="0">  <title>StitchIT</title>  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%233b82f6'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='white' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%233b82f6'/%3E%3C/svg%3E">    <style>    :root {      --bg-color: #121214;      --card-bg: #1e1e24;      --accent: #3b82f6;      --accent-hdr: #f59e0b;      --text: #e4e4e7;      --text-dim: #a1a1aa;      --border: #27272a;    }    html, body {      margin: 0;      padding: 0;      width: 100%;      height: 100%;      overflow: hidden;    }    /* Floating UI panel overlay */    * { box-sizing: border-box; margin: 0; padding: 0; }    body {      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;      background: var(--bg-color);      color: var(--text);      display: flex;      flex-direction: column;      height: 100%;      min-height: 100vh;      overflow: hidden;    }    header {      padding: 1rem 1.5rem;      background: var(--card-bg);      border-bottom: 1px solid var(--border);      display: flex;      align-items: center;      justify-content: space-between;      flex-wrap: wrap;      gap: 1rem;      flex-shrink: 0;    }    h1 { font-size: 1.25rem; font-weight: 600; }    header h1 { font-size: 1.625rem; }    header button { font-size: 0.975rem; padding: 0.39rem 0.65rem; }    .toolbar {      display: flex;      gap: 0.5rem;      flex-wrap: wrap;      align-items: center;    }    button, .btn {      background: var(--border);      color: #fff;      border: 1px solid rgba(255,255,255,0.1);      padding: 0.3rem 0.5rem;      border-radius: 4px;      font-size: 0.75rem;      font-weight: 600;      cursor: pointer;      transition: background 0.2s ease, opacity 0.2s ease;    }    button:hover { background: #3f3f46; }    button.primary { background: var(--accent); }    button.primary:hover { background: #2563eb; }    button.hdr-btn { background: var(--accent-hdr); }    button.hdr-btn:hover { background: #d97706; }    button.active { background: #10b981; }    button.active:hover { background: #059669; }    .header-btns {      display: flex;      gap: 4px;    }    @keyframes btn-flash {      0% { background: #10b981; color: #fff; }      100% { background: var(--border); }    }    button.flash {      animation: btn-flash 0.3s ease-out;    }    .toggle-row {      display: flex;      gap: 6px;      align-items: center;    }    .toggle-row button { flex: 1; }    button:disabled {      opacity: 0.5;      cursor: not-allowed;    }    /* The "+ Stitched" buttons sit right after their parent loader, so pull them       in (negative margin cancels most of the toolbar gap) to read as a pair.       Square the adjoining corners so the two read as one connected control. */    #hdrBtn, #blendBtn, #chooseBtn {      border-top-right-radius: 0;      border-bottom-right-radius: 0;      padding-right: 0.6rem;    }    #hdrStitchedBtn, #blendStitchedBtn, #openStitchedBtn {      margin-left: -0.35rem;      border-top-left-radius: 0;      border-bottom-left-radius: 0;      padding-left: 0.5rem;      opacity: 0.75;    }    /* Open + its "+ Stitched" get the green "active" look. */    #chooseBtn, #openStitchedBtn {      background: #10b981;      color: #fff;    }    #chooseBtn:hover, #openStitchedBtn:hover {      background: #059669;    }    .hidden { display: none !important; }    main {      display: grid;      grid-template-columns: 1fr 340px;      flex: 1;      min-height: 0;      overflow: hidden;      height: 100%;    }    @media (max-width: 900px) {      main { grid-template-columns: 1fr; }      .sidebar { display: none; }    }    .viewport {      display: flex;      flex-direction: column;      align-items: center;      justify-content: center;      background: #000;      position: relative;      padding: 0;      min-height: 0;      height: 100%;      overflow: hidden;    }    canvas#panoramaCanvas {      max-width: 100%;      max-height: 100%;      width: auto;      height: auto;      border-radius: 0;      box-shadow: none;      object-fit: contain;    }    /* In 3D mode the same canvas hosts the spherical view and should fill the       viewport instead of letterboxing the equirect strip. */    canvas#panoramaCanvas.viewer-3d {      width: 100%;      height: 100%;      max-width: none;      max-height: none;      object-fit: fill;    }    .float-btn {      position: absolute;      z-index: 5;      background: rgba(20,20,20,0.7);      color: #fff;      border: 1px solid rgba(255,255,255,0.2);      padding: 0.4rem 0.8rem;      border-radius: 6px;      font-size: 0.8rem;      font-weight: 600;      cursor: pointer;      backdrop-filter: blur(4px);    }    .float-btn:hover { background: rgba(40,40,40,0.85); }    .float-tr { top: 12px; right: 12px; }    .float-tl { top: 12px; left: 12px; }    .sidebar {      background: var(--card-bg);      border-left: 1px solid var(--border);      padding: 1rem;      overflow-y: auto;      display: flex;      flex-direction: column;      gap: 1.25rem;    }    .control-group {      display: flex;      flex-direction: column;      gap: 0.5rem;    }    .control-header {      display: flex;      align-items: center;      justify-content: space-between;      border-bottom: 1px solid var(--border);      padding-bottom: 0.35rem;    }    .control-group h3 {      font-size: 0.85rem;      text-transform: uppercase;      letter-spacing: 0.05em;      color: var(--text-dim);    }    .control-row {      display: flex;      align-items: center;      justify-content: space-between;      font-size: 0.85rem;      gap: 0.5rem;    }    .control-row label { flex: 1; }    .control-row input[type="range"] { flex: 1.5; }    .control-row span { width: 45px; text-align: right; font-family: monospace; color: var(--text-dim); }    .loader-overlay {      position: absolute;      inset: 0;      background: rgba(0,0,0,0.8);      display: flex;      flex-direction: column;      align-items: center;      justify-content: center;      z-index: 10;      gap: 1rem;    }    .spinner {      width: 40px;      height: 40px;      border: 4px solid var(--border);      border-top-color: var(--accent);      border-radius: 50%;      animation: spin 1s linear infinite;    }    @keyframes spin { to { transform: rotate(360deg); } }
    /* Coloured slider thumbs: orange for HDR bell params + FOV, green for radiusScale. */
    #hdrSigma, #hdrBellCenter, #hdrBase, #fovDeg {
      accent-color: var(--accent-hdr);
    }
    #hdrSigma::-webkit-slider-thumb,
    #hdrBellCenter::-webkit-slider-thumb,
    #hdrBase::-webkit-slider-thumb,
    #fovDeg::-webkit-slider-thumb { background: #fff !important; }
    #hdrSigma::-moz-range-thumb,
    #hdrBellCenter::-moz-range-thumb,
    #hdrBase::-moz-range-thumb,
    #fovDeg::-moz-range-thumb { background: #fff !important; border-color: var(--accent-hdr) !important; }
    #radiusScale { accent-color: #22c55e; }
    #radiusScale::-webkit-slider-thumb { background: #fff !important; }
    #radiusScale::-moz-range-thumb { background: #fff !important; border-color: #22c55e !important; }
    #welcomeOverlay {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      pointer-events: none; z-index: 5;
    }
  </style></head><body>  <header>    <h1>StitchIT</h1>    <div class="toolbar">      <!-- Hidden File Inputs -->      <input type="file" id="imageLoader" accept="image/*" class="hidden">      <input type="file" id="hdrImageLoader" accept="image/*" multiple class="hidden">      <input type="file" id="blendImageLoader" accept="image/*" multiple class="hidden">      <input type="file" id="stitchedBlendLoader" accept="image/*" multiple class="hidden">      <input type="file" id="stitchedHdrLoader" accept="image/*" multiple class="hidden">      <input type="file" id="openStitchedLoader" accept="image/*" class="hidden">      <input type="file" id="profileLoader" accept="application/json,.json" class="hidden">      <!-- File & Processing Action Buttons -->      <button id="chooseBtn">Open OO</button>      <button id="openStitchedBtn" title="Open an already-stitched equirectangular panorama (skips alignment)">Stitched</button>      <button id="hdrBtn" class="hdr-btn">HDR Merge OO</button>      <button id="hdrStitchedBtn" class="hdr-btn" title="Load already-stitched equirectangular panoramas to HDR-merge (skips alignment)">Stitched</button>      <button id="blendBtn" class="primary">Merge OO</button>      <button id="blendStitchedBtn" class="primary" title="Load already-stitched equirectangular panoramas to merge (skips alignment)">Stitched</button>      <button id="x2Btn">HD</button>      <!-- Export & Preview Action Buttons -->      <div id="actions" class="toolbar hidden">        <button id="downloadBtn">Export PNG</button>        <button id="downloadJpgBtn" class="primary">Export JPG (XMP)</button>      </div>    </div>  </header>  <main>    <div class="viewport" id="resultContainer">      <div id="loader" class="loader-overlay hidden">        <div class="spinner"></div>        <p id="loaderMsg">Processing image...</p>      </div>      <canvas id="panoramaCanvas"></canvas>      <div id="panoramaViewerContainer" class="hidden"></div>      <button id="viewModeBtn" class="float-btn float-tr">3D</button>    </div>    <!-- ...existing sidebar with all control groups... -->    <aside class="sidebar">      <!-- 1. Post-Processing -->      <div class="control-group" id="ppControlGroup">        <div class="control-header">          <h3>Processing</h3>          <div style="display: flex; gap: 0.3rem;">            <button id="enablePostBtn" class="active">ON</button>            <div class="header-btns">              <button id="saveProcBtn">Save</button>              <button id="loadProcBtn">Load</button>            </div>          </div>        </div>        <div class="control-row">          <label for="exposure">Exposure</label>          <input type="range" id="exposure" min="0.2" max="3.0" step="0.05" value="1.0">          <span id="exposureVal">1.00</span>        </div>        <div class="control-row">          <label for="gammaPP">Gamma</label>          <input type="range" id="gammaPP" min="0.2" max="2.5" step="0.05" value="1.0">          <span id="gammaPPVal">1.00</span>        </div>        <div class="control-row">          <label for="contrast">Contrast</label>          <input type="range" id="contrast" min="0.5" max="2.0" step="0.05" value="1.0">          <span id="contrastVal">1.00</span>        </div>        <div class="control-row">          <label for="saturation">Saturation</label>          <input type="range" id="saturation" min="0.0" max="2.0" step="0.05" value="0.85">          <span id="saturationVal">0.85</span>        </div>        <div class="control-row">          <label for="sharpen">Sharpen (CAS)</label>          <input type="range" id="sharpen" min="0.0" max="2.0" step="0.02" value="0.5">          <span id="sharpenVal">0.50</span>        </div>        <div class="control-row">          <label for="temperature">WB</label>          <input type="range" id="temperature" min="2000" max="12000" step="50" value="6500">          <span id="temperatureVal">6500</span>          <button id="pickGrayBtn">Sample</button>        </div>      </div>      <!-- 1c. Watermark (nadir decal) -->      <div class="control-group" id="wmControlGroup">        <div class="control-header">          <h3>Watermark</h3>          <div class="header-btns">            <button id="wmRemoveBtn">Remove</button>            <button id="wmBtn">Load</button>          </div>        </div>        <input type="file" id="wmImageLoader" accept="image/*" class="hidden">        <div class="control-row">          <label for="wmSize">Size</label>          <input type="range" id="wmSize" min="0.05" max="1.0" step="0.01" value="0.3">          <span id="wmSizeVal">0.30</span>        </div>        <div class="control-row">          <label for="wmRot">Rotation</label>          <input type="range" id="wmRot" min="0" max="360" step="1" value="0">          <span id="wmRotVal">0</span>        </div>      </div>      <!-- 1b. HDR Settings -->      <div class="control-group">          <div class="control-header">            <h3>HDR Settings</h3>            <div class="header-btns">              <button id="saveHdrBtn">Save</button>              <button id="loadHdrBtn">Load</button>            </div>          </div>        <canvas id="hdrBellChart" width="300" height="80" style="width:100%; height:auto; border-radius:4px; display:block; background:#0e0e10;"></canvas>        <div class="control-row">          <label for="hdrSigma">Bell Width (σ)</label>          <input type="range" id="hdrSigma" min="0.05" max="1.0" step="0.01" value="0.30">          <span id="hdrSigmaVal">0.35</span>        </div>        <div class="control-row">          <label for="hdrBellCenter">Bell Center</label>          <input type="range" id="hdrBellCenter" min="0.0" max="1.0" step="0.01" value="0.30">          <span id="hdrBellCenterVal">0.50</span>        </div>        <div class="control-row">          <label for="hdrBase">Base Weight</label>          <input type="range" id="hdrBase" min="0.05" max="0.50" step="0.005" value="0.30">          <span id="hdrBaseVal">0.05</span>        </div>        <div class="control-row">          <label for="hdrEV">Exposure</label>          <input type="range" id="hdrEV" min="-2" max="2" step="0.05" value="-0.30">          <span id="hdrEVVal">0.00</span>        </div>      </div>      <!-- 2. Lens Geometry -->      <div class="control-group" id="lensGeoGroup">        <div class="control-header">          <h3>Lens Geometry</h3>          <div class="header-btns">            <button id="saveGeoBtn">Save</button>            <button id="loadGeoBtn">Load</button>          </div>        </div>        <div class="control-row">          <label for="fovDeg">FOV (°)</label>          <input type="range" id="fovDeg" min="140" max="220" step="0.1" value="186.8">          <span id="fovDegVal">190.0</span>        </div>        <div class="control-row">          <label for="radiusScale">Radius Scale</label>          <input type="range" id="radiusScale" min="0.25" max="1.0" step="0.001" value="0.95">          <span id="radiusScaleVal">0.970</span>        </div>        <div class="control-row">          <label for="seamWidth">Seam Width</label>          <input type="range" id="seamWidth" min="0" max="100" step="1" value="0">          <span id="seamWidthVal">50</span>        </div>                </div>        <div class="control-row">          <label for="seamShift">Seam Shift</label>          <input type="range" id="seamShift" min="-2" max="2" step="0.1" value="0">          <span id="seamShiftVal">0.0</span>        </div>        <!-- Schematic preview -->        <canvas id="lensSchematicCanvas" width="280" height="140" style="width:100%;border-radius:4px;background:#000;display:block;margin-top:4px;"></canvas>      </div>      <!-- 3. Lens Alignment -->      <div class="control-group" id="lensAlignmentGroup">        <div class="control-header">          <h3>Lens Alignment</h3>          <div class="header-btns">            <button id="autoAlignBtn" class="active" title="Automatically optimise lens geometry to minimise overlap error. Disable for moving subjects like trees or water.">Auto</button>            <button id="mirror3DBtn">Mirror</button>          </div>        </div>        <!-- Center position (horizontal) -->        <div class="control-row">          <label for="centerL">Center L</label>          <input type="range" id="centerL" min="0.2" max="0.3" step="0.001" value="0.25">          <span id="centerLVal">0.250</span>        </div>        <div class="control-row">          <label for="centerR">Center R</label>          <input type="range" id="centerR" min="0.7" max="0.8" step="0.001" value="0.75">          <span id="centerRVal">0.750</span>        </div>        <!-- Trapezoid edges (vertical, centred at 0) -->        <div style="display:flex; gap:6px; align-items:center; justify-content:center; margin-top:6px;">          <!-- Col 1: Right of Right Lens -->          <div style="display:flex;flex-direction:row;align-items:flex-end;gap:2px;">            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="RightLensRight" min="-10" max="10" step="0.5" value="0" style="writing-mode:vertical-lr; direction:rtl; height:140px; width:22px;">              <span id="RightLensRightVal">0</span>            </div>            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="RightLensRightCenterV" min="-1" max="1" step="0.05" value="0" style="writing-mode:vertical-lr; direction:rtl; height:90px; width:22px;">              <span id="RightLensRightCenterVVal">0</span>            </div>          </div>          <!-- Col 2: Left of left lens -->          <div style="display:flex;flex-direction:row;align-items:flex-end;gap:2px;">            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="LeftLensLeftCenterV" min="-1" max="1" step="0.05" value="0" style="writing-mode:vertical-lr; direction:rtl; height:90px; width:22px;">              <span id="LeftLensLeftCenterVVal">0</span>            </div>            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="LeftLensLeft" min="-10" max="10" step="0.5" value="0" style="writing-mode:vertical-lr; direction:rtl; height:140px; width:22px;">              <span id="LeftLensLeftVal">0</span>            </div>          </div>          <!-- Col 3: Right of left lens -->          <div style="display:flex;flex-direction:row;align-items:flex-end;gap:2px;">            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="LeftLenRight" min="-10" max="10" step="0.5" value="0" style="writing-mode:vertical-lr; direction:rtl; height:140px; width:22px;">              <span id="LeftLenRightVal">0</span>            </div>            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="LeftLensRightCenterV" min="-1" max="1" step="0.05" value="0" style="writing-mode:vertical-lr; direction:rtl; height:90px; width:22px;">              <span id="LeftLensRightCenterVVal">0</span>            </div>          </div>          <!-- Col 4: Left of Right lens -->          <div style="display:flex;flex-direction:row;align-items:flex-end;gap:2px;">            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="RightLensLeftCenterV" min="-1" max="1" step="0.05" value="0" style="writing-mode:vertical-lr; direction:rtl; height:90px; width:22px;">              <span id="RightLensLeftCenterVVal">0</span>            </div>            <div style="display:flex;flex-direction:column;align-items:center;font-size:0.65rem;color:#a1a1aa;line-height:1.3;">              <input type="range" id="RightLensLeft" min="-10" max="10" step="0.5" value="0" style="writing-mode:vertical-lr; direction:rtl; height:140px; width:22px;">              <span id="RightLensLeftVal">0</span>            </div>          </div>                  </div>        <div class="control-row toggle-row">          <button id="resetTrapBtn" title="Reset all trapezoid sliders">Reset values</button>          <button id="seamBtn" title="Show the automatically selected seam">Seam</button>        </div>        <div class="control-row toggle-row">          <button id="exportProfileBtn" title="Save camera/lens calibration as JSON">Export Profile</button>          <button id="importProfileBtn" title="Load camera/lens calibration JSON">Import Profile</button>        </div>      </div>    </aside>  </main>  <!-- Loaded as classic scripts (in dependency order) so the app works both from       a local file:// URL and when served. Helpers are shared via window.S360. -->  <script src="gpu-memory.js"></script>
<script src="webgl-utils.js"></script>  <script src="align.js"></script>  <script src="watermark.js"></script>  <script src="hdr.js"></script>  <script src="exporter.js"></script>  <script src="shaders.js"></script>  <script src="image.js"></script>  <script src="seam.js"></script>  <script src="blend.js"></script>  <script src="settings.js"></script>  <script src="viewer.js"></script>  <script src="stitcher.js"></script></body></html>
